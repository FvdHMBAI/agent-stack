version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: agent-stack-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: agent-stack-postgres
    environment:
      POSTGRES_USER: agent-stack
      POSTGRES_PASSWORD: agent-stack
      POSTGRES_DB: agent_stack
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent-stack"]
      interval: 5s
      timeout: 3s
      retries: 5

  agent-stack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-stack
    environment:
      OLLAMA_URL: "http://ollama:11434/api/generate"
      OLLAMA_MODEL: "qwen3:8b"
      NIGHTSHIFT_DB_URL: "postgresql://agent-stack:agent-stack@postgres:5432/agent_stack"
      NIGHTSHIFT_DB_MODE: "postgres"
      AGENT_STACK_DIR: "/opt/agent-stack"
    volumes:
      - ./repos:/repos
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["agent-stack", "doctor"]

volumes:
  ollama-data:
  postgres-data:
